services:
  db:
    image: postgres:16-alpine
    container_name: perfume-shop-db
    environment:
      POSTGRES_DB: perfume_shop
      POSTGRES_USER: perfume
      POSTGRES_PASSWORD: perfume
    ports:
      - "5432:5432"
    volumes:
      - perfume_shop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfume -d perfume_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: perfume-shop-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/perfume_shop
      SPRING_DATASOURCE_USERNAME: perfume
      SPRING_DATASOURCE_PASSWORD: perfume
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  perfume_shop_pgdata:
