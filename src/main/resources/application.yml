spring:
  application:
    name: perfume-shop
  datasource:
    url: jdbc:postgresql://localhost:5432/perfume_shop
    username: perfume
    password: perfume
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080

app:
  jwt:
    secret: "perfume-shop-dev-jwt-secret-key-change-me-32bytes-min"
    expiration-ms: 3600000
  crm:
    enabled: true
    bitrix24:
      enabled: true
      # Inbound webhook base URL, e.g. https://example.bitrix24.ru/rest/1/secret/
      # Empty → stub mode (local SUCCESS events, no HTTP)
      webhook-base-url: ${BITRIX24_WEBHOOK_BASE_URL:}
    amocrm:
      enabled: true
      # Account base URL + long-lived token; empty → stub mode
      base-url: ${AMOCRM_BASE_URL:}
      access-token: ${AMOCRM_ACCESS_TOKEN:}
