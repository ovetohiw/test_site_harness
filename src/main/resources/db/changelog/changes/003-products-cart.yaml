databaseChangeLog:
  - changeSet:
      id: 003-create-products
      author: perfume-shop
      comment: Catalog products with name, image, price, description
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: products

  - changeSet:
      id: 003-seed-products
      author: perfume-shop
      comment: Seed sample perfume catalog
      changes:
        - insert:
            tableName: products
            columns:
              - column: { name: name, value: "Noir Ember" }
              - column: { name: image_url, value: "/images/noir-ember.svg" }
              - column: { name: price, valueNumeric: 8900.00 }
              - column: { name: description, value: "Тёплый древесно-пряный аромат с нотами кожи и смолы." }
        - insert:
            tableName: products
            columns:
              - column: { name: name, value: "Verde Mist" }
              - column: { name: image_url, value: "/images/verde-mist.svg" }
              - column: { name: price, valueNumeric: 7200.00 }
              - column: { name: description, value: "Свежая зелень и цитрус — лёгкий дневной шлейф." }
        - insert:
            tableName: products
            columns:
              - column: { name: name, value: "Amber Loom" }
              - column: { name: image_url, value: "/images/amber-loom.svg" }
              - column: { name: price, valueNumeric: 9800.00 }
              - column: { name: description, value: "Янтарь, ваниль и мягкий мускус для вечернего настроения." }
        - insert:
            tableName: products
            columns:
              - column: { name: name, value: "Salt Petal" }
              - column: { name: image_url, value: "/images/salt-petal.svg" }
              - column: { name: price, valueNumeric: 6500.00 }
              - column: { name: description, value: "Солёный бриз и белые цветы — морская чистота." }
      rollback:
        - delete:
            tableName: products
            where: name IN ('Noir Ember', 'Verde Mist', 'Amber Loom', 'Salt Petal')

  - changeSet:
      id: 003-create-carts
      author: perfume-shop
      comment: Anonymous carts identified by client UUID
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: cart_id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_cart_items
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_cart_items
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_cart
            baseTableName: cart_items
            baseColumnNames: cart_id
            referencedTableName: carts
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_cart_items_product
            baseTableName: cart_items
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
      rollback:
        - dropTable:
            tableName: cart_items
        - dropTable:
            tableName: carts
