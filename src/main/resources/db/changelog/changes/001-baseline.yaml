databaseChangeLog:
  - changeSet:
      id: 001-baseline-schema-marker
      author: perfume-shop
      comment: Baseline marker confirming Liquibase is wired to PostgreSQL
      changes:
        - createTable:
            tableName: schema_baseline
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
                  defaultValueComputed: CURRENT_TIMESTAMP
      rollback:
        - dropTable:
            tableName: schema_baseline
